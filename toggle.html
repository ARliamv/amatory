<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="styles/toggle.css">
  <title>Box</title>
  <style>
    body {
      background-image: radial-gradient(circle, #000000, #250c12, #420d18, #610819, #7e0315);
      opacity: 1;
      transition: opacity 1s ease-in-out;
    }
    body.fade-out {
      opacity: 0;
    }

    
  </style>
</head>
<body style="background-color: black; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;">
  <div class="love">
    <input id="switch" type="checkbox" onclick="goToButton()">
    <label class="love-heart" for="switch">
      <i class="left"></i>
      <i class="right"></i>
      <i class="bottom"></i>
      <div class="round"></div>
    </label>
  </div>
  <script>
    function goToButton() {
      document.body.classList.add('fade-out');
      setTimeout(function() {
        window.location.href = 'button.html';
      }, 3000);
    }
  </script>
</body>
</html>
